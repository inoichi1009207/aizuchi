# 表情包描述表的**格式示例**。
#
# 真正的表情包与描述表放在 stickers/ 下,该目录被 gitignore —— 本项目不分发任何图片素材。
# 使用者自备图片,把这份文件复制成 stickers/stickers.yaml 后按自己的图填写。
#
# 也可以让 setup 脚本用视觉模型自动生成初稿(一次性,10 张图成本可忽略),再人工校对。

# 关于整个池子的说明。会被原样放进 prompt。
# 最重要的用途:告诉模型这个池子**缺**什么情绪,好让它在缺口场合主动弃权。
pool_note: |
  例:本表情池只有正面与中性情绪,没有负面表情。
  遇到需要表达否定、同情或无语的场合,请弃权而不是硬凑一张。

stickers:
  - file: example-01.jpg      # stickers/ 下的文件名
    mood: 开心                # 一两个字的情绪标签
    desc: 角色笑着比出大拇指。 # 客观描述画面,不要写解读
    use_when: 赞同、鼓励、事情顺利   # 什么语境下该用它

  - file: example-02.jpg
    mood: 困惑
    desc: 角色歪头,头顶一个问号。
    use_when: 没看懂、话题跳跃
