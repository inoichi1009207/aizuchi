# 复制为 config.yaml 后填写。config.yaml 被 gitignore。

llm:
  # 本插件**不自己持有 API key、不自建 HTTP 通道**,
  # 而是走 AstrBot 已配置好的 provider(context.get_using_provider)。
  # ⇒ 凭据只存在于 AstrBot 的配置里一处,插件侧完全不碰。
  #
  # 下面只是给这次调用指定用哪个模型;留空则用 AstrBot 的默认 provider 模型。
  # 输出只有几个 token,贵模型没有意义。
  #
  # 用 vision 版的理由:群里大量内容是表情包与图片,纯文字模型读不到那部分 ——
  # 对一个「读气氛」的 bot 来说这是致命盲区。
  # ⚠️ 单价与非 vision 版相同(官方价目表),差别只在图片消耗的 token 数,该数未实测。
  model: deepseek-v4-flash-vision-exp

vision:
  # 每次调用最多带几张群里最近出现的图。图片吃 token 远多于文字,这是成本闸门。
  # 设为 0 = 完全不看图,退回纯文字模式。
  max_images: 3

stickers:
  dir: ./stickers
  table: ./stickers/stickers.yaml

# 被 @ 时:总是回,但防同一个人连续刷
mention:
  # always_reply 已移除:代码从不读它。留着会让人以为把它设 false 就能停止 @ 回复。
  # 同一个人在这个秒数内重复 @,只回第一次 —— 防有人拿它当玩具连点。
  # 2026-08-28 由 20 调到 10:实测 20 秒会把正常的连续追问也吞掉。
  per_user_cooldown_sec: 10

# 主动发言:防的是刷屏,不是防发言。
#
# ⚠️ 本节**只在 aiocqhttp(NapCat 等)通道下有意义**。
#    走 qqofficial(官方机器人)时它拿不到判断氛围所需的输入,实际形同虚设。
#    (「完全不会触发」尚未实测,但下面两条已由官方文档核实:)
#      · QQ 群场景的事件订阅里只有「群内 @ 机器人」与「单聊」,
#        没有「群内全部消息」—— 收不到消息就无从判断氛围;
#      · 未填 msg_id/event_id 的主动消息配额是每月 4 条,与本节的日配额差两个数量级。
#    走官方通道时把 rate 设为 0,免得看着像在工作。
proactive:
  # ⚠️ 尽管在 proactive 段下,cap_per_24h 与下面的 mention_floor_sec
  #    现在**同时管住被 @ 路径** —— limiter 用的就是这一段。
  mention_floor_sec: 3   # 被 @ 时两次发送的全局最小间隔(秒)。
                         # 与 min_interval_sec 分开:直接叫你就该回应,
                         # 但十个人轮流 @ 不能变成每秒一张。
  # ⚠️ 三个参数的分工(2026-08-28 参数扫描实测,非推测):
  #    ⚠️ 该扫描测的是 **limiter.py 单体**,不是部署后的系统 ——
  #    同步台架里模型永远说「发」、也没有在途标志。生产中模型约 78% 弃权,
  #    且 2–50 秒的模型调用期间进来的消息会被在途标志丢弃。
  #    结论对 limiter 成立,别当成对整只机器人的预测。
  #    活跃群里 cap_per_24h 是**唯一**的总量闸 —— 固定 cap=15 时,
  #    rate 从 0.01 扫到 1.0,三天总量恒为 45 次,一次不多一次不少;
  #    而固定 rate、只动 cap,总量完全线性(15/24/36/60 → 45/72/108/180)。
  #    ⇒ 想多冒泡就调 cap;rate 只管节奏自然度(高 rate = 冷却一结束就发,显机械)。
  #    ⚠️ 前提是群足够活跃(扫描用的是日均 2880 条的密集流)。
  #       冷清的群里 rate 会重新成为瓶颈。
  # 2026-08-28 第二次调整:**控制权从硬闸转移到模型判断**。
  #   起初三道闸都是结构性的(冷却/配额/骰子),模型只负责挑图 ——
  #   而它收到的提示词在「被 @」和「主动冒泡」两种场景下完全一样,
  #   等于从没被告知自己在做「要不要插话」这个决定。现已分成两套提示词,
  #   主动模式明确写着「沉默是默认答案,发言需要理由」。
  #   ⇒ 既然判断力交给了模型,结构闸就该放松到只兜底,而不是替它做决定。
  rate: 0.3                 # 调高:让模型有足够多的机会去判断(它现在会自己弃权)
  # 420 → 90 → 60。这个数只剩一个作用:防「连珠炮」。
  # 判断该不该说话是模型的事(见双模式提示词),它只保证物理上不会一秒一张。
  min_interval_sec: 60
  # 2026-08-28 第三次调整:配额的**角色**变了,不再管节奏,只管兜底。
  #   48 太低,活跃时段会烧掉大半、晚上变哑(前重后轻)。
  #   但也不能关掉:关了之后唯一限制就是 90 秒间隔,理论上一天 960 张。
  #   代价不对称 —— 前重后轻只是烦人、改个数就好;
  #   失控刷屏可能把 QQ 小号打进风控,**那是不可逆的**。
  #   ⇒ 抬到正常情况下永不触发、只在失灵时兜底的高度。
  #   写 0 或负数 = 明确关闭上限(代码支持,但请知道你关掉的是最后一道防线)。
  cap_per_24h: 150
  context_window: 20        # 交给模型看的最近消息条数

  # 自适应节奏:按「自己的发言占比 vs 公平份额 1/(人数+1)」调整积极性。
  # 人少的群放开、人多的群收敛 —— 静态闸做不到这件事。
  # 实测(2 小时模拟,每 10 秒一条消息):
  #   静态   2人群 46 次 / 12人群 46 次   ← 不感知人数
  #   自适应 2人群 72 次 / 12人群 53 次   ← 按份额调节
  #
  # 2026-08-28 已启用。此前默认关闭的理由是「零数据,不该对着想象调参」,
  # 但那个理由有个漏洞:**不开就永远不会有自适应的数据**。
  # 静态基线已采到(76 条消息 / 4 次咨询 / 2 次弃权 / 2 次发送,模型弃权率 50%),
  # 现在开着跑,与该基线对照。
  # 硬闸(冷却/配额)永远先过,自适应只影响骰子,算错也突破不了物理上限。
  adaptive:
    enable: true
    window_sec: 600       # 观察窗口:统计这段时间内的发言人与消息数
    boost: 2.0            # 自己说得少于公平份额时,骰子率乘以它
    suppress: 0.3         # 说得多于公平份额时,骰子率乘以它
  # 不追踪也不回避最近用过哪几张:重复本身不是问题,冷却已经把频率压住了。

# 冷却与配额状态落盘,重启后仍然生效
state_file: ./state.json

# 只在这些群生效;**留空 = 一个群都不响应**(fail-closed;早期版本是「全部群」,漏配即在所有群冒泡)。
# ⚠️ 平台不同,这里填的东西不同:
#   · qqofficial(官方机器人):填 group_openid —— 一串不透明字符串,不是 QQ 群号
#   · aiocqhttp(NapCat 等):  填 QQ 群号
groups: []

# 已知的其他机器人 QQ 号 —— 防两个 bot 互相触发的回声循环。
# OneBot 没有通用的「对方是 bot」标志,自己可以机器判定,别人只能靠这份名单。
ignore_sender_ids: []

# 硬规则(无配置项,写死在代码里):
#   - 忽略来自其他 bot 与自身的消息 —— 防回声循环
#   - 不提供任何聊天内命令 —— 把注入面压到只剩「池子里的某一张图」,配置只走本文件
